name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Node Dependencies
      run: npm install

    - name: Sync Capacitor Web Assets
      run: npx cap sync android

    - name: Make Gradle Wrapper Executable
      run: chmod +x ./android/gradlew

    - name: Build Debug APK
      id: build_apk
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace > ../gradle_apk.log 2>&1 || {
          ERR=$(tail -n 25 ../gradle_apk.log | tr '\n' ' ')
          echo "::error title=GradleApkError::$ERR"
          cat ../gradle_apk.log | tail -n 50
          exit 1
        }

    - name: Build Android App Bundle (.aab)
      id: build_aab
      run: |
        cd android
        ./gradlew bundleRelease --stacktrace > ../gradle_aab.log 2>&1 || {
          ERR=$(tail -n 25 ../gradle_aab.log | tr '\n' ' ')
          echo "::error title=GradleAabError::$ERR"
          cat ../gradle_aab.log | tail -n 50
          exit 1
        }

    - name: Prepare Release Files
      run: |
        mkdir -p release_files
        find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release_files/DONERCI.apk \;
        find android/app/build/outputs/bundle/ -name "*.aab" -exec cp {} release_files/DONERCI.aab \;
        ls -la release_files/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DONERCI-Ilova-Fayllari-APK-va-AAB
        path: release_files/*

    - name: Create GitHub Release with Direct Download Links
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.4
        name: "DONERCI v1.0.4 (APK & AAB)"
        body: |
          ### 🌯 DONERCI Mobil Ilova Fayllari
          - **DONERCI.apk** — Telefonlarga to'g'ridan-to'g'ri o'rnatish uchun
          - **DONERCI.aab** — Google Play Store (Play Market)ga joylash uchun
        files: |
          release_files/DONERCI.apk
          release_files/DONERCI.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
