name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Install Node Dependencies
      run: npm install

    - name: Sync Capacitor Web Assets
      run: npx cap sync android

    - name: Make Gradle Wrapper Executable
      run: chmod +x ./android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Build Android App Bundle (.aab)
      run: |
        cd android
        ./gradlew bundleDebug bundleRelease || ./gradlew bundle

    - name: Upload APKs (.apk fayllar)
      uses: actions/upload-artifact@v4
      with:
        name: DONERCI-Telefon-Uchun-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload AABs (.aab fayllar)
      uses: actions/upload-artifact@v4
      with:
        name: DONERCI-Play-Market-AAB
        path: android/app/build/outputs/bundle/**/*.aab
